services:
  - type: web
    name: maison-momento
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn maison_momento.wsgi:application"
    plan: free
    region: oregon
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: maison-momento-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.2"

databases:
  - name: maison-momento-db
    plan: free
    region: oregon
