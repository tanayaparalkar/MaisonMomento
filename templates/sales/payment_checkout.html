{% extends "catalog/base.html" %}

{% block title %}Proceed to Payment - Maison Momènto{% endblock %}

{% block content %}
<main class="sf-container" style="padding-top: 100px; padding-bottom: 120px; max-width: 600px; margin: 0 auto; text-align: center;">
    <div style="background: var(--bg-alt); padding: 48px 36px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.06);">
        <h1 style="font-family: var(--font-display); font-size: 26px; font-weight: 500; margin-bottom: 16px; color: var(--text-color);">
            Complete Your Payment
        </h1>
        <p style="font-family: 'Inter', sans-serif; font-size: 14px; color: var(--muted); margin-bottom: 24px;">
            Order <strong>#{{ order.order_number }}</strong> has been prepared. Total to pay: <strong>₹{{ order.total }}</strong>.
        </p>

        <button id="rzp-pay-now-btn" class="primary-btn sf-btn-large" style="width: 100%; margin-bottom: 16px;">
            Pay with Razorpay
        </button>

        <a href="{% url 'sales:cart' %}" style="font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); text-decoration: none;">
            Cancel and Return to Cart
        </a>
    </div>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const options = {
        key: "{{ razorpay_key_id }}",
        amount: {{ amount }},
        currency: "{{ currency }}",
        name: "Maison Momento Parfumeur",
        description: "Order #{{ order.order_number }}",
        order_id: "{{ razorpay_order_id }}",
        prefill: {
            name: "{{ order.customer_name }}",
            email: "{{ order.email }}",
            contact: "{{ order.phone }}"
        },
        theme: {
            color: "#0F1E28"
        },
        handler: function(response) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = "{{ verify_url }}";

            const fields = {
                'csrfmiddlewaretoken': '{{ csrf_token }}',
                'razorpay_payment_id': response.razorpay_payment_id,
                'razorpay_order_id': response.razorpay_order_id,
                'razorpay_signature': response.razorpay_signature,
                'order_number': '{{ order.order_number }}'
            };

            for (const key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }
    };

    const rzp = new Razorpay(options);
    document.getElementById('rzp-pay-now-btn').addEventListener('click', function() {
        rzp.open();
    });

    // Automatically open on load
    window.addEventListener('DOMContentLoaded', () => {
        rzp.open();
    });
</script>
{% endblock %}
